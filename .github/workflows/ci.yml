name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify hub scaffold
        run: |
          test -f package.json
          test -f apps/site/package.json
          test -f apps/site/vite.config.ts
          test -f apps/site/tsr.config.json
          test -f apps/site/tsconfig.json
          test -f apps/site/wrangler.jsonc
          test -f apps/site/src/router.tsx
          test -f apps/site/src/routes/__root.tsx
          test -f apps/site/src/routes/index.tsx
          test -f apps/site/src/routes/news.tsx
          test -f LICENSE
          test -f README.md

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Validate project index
        run: bun run check:index

      - name: Validate hub site
        run: bun run check:site

      - name: Test
        run: bun test

      - name: Lint
        run: bun run lint

      - name: Typecheck hub site
        run: bun run typecheck

      - name: Build hub site
        run: bun run build:site

      - name: Validate consumer fixture
        run: bun run check:fixture

      - name: Trial scaffold template
        run: bun run check:scaffold-trial
