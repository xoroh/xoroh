name: Feature request
description: Propose a change or new capability
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Please search existing issues first. Do not include secrets or personal data.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
